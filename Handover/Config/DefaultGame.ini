

[/Script/ACE_ASR.ACEASRSettings]
; CUDA backend's CUDA/D3D12 context-sharing ("CiG") init is failing on this machine
; (cuCtxCreate_v4 INVALID_VALUE - typically a multi-GPU/driver interop issue, not a
; project config problem). DirectML runs through DX12 directly and skips that interop
; path entirely. Switch back to GPU (CUDA) later if you want to chase the root cause -
; this is a workaround, not a real fix.
PreferredBackend=DirectML
; Conversation is no longer push-to-talk (T is a single "start conversation" press with
; no release binding) - each utterance now has to auto-finalize on its own when the user
; pauses. This watchdog stops microphone capture (and finalizes the transcript) after this
; many seconds without a transcript update. 0 (the plugin default) disables it entirely,
; which would leave the mic capturing forever with no way to end a turn.
MaxCaptureInactivitySeconds=2.5

[/Script/ACE_TTS.ACETTSSettings]
; CUDA fails the same way ACE_ASR's did (shared CIG CUDA/D3D12 interop is broken on this
; machine). D3D12 backend turned out to be a dead end too: in this plugin build,
; ACETTSNVIGIRuntime.cpp only requests CIG interop setup (bNeedsCIG) when
; PreferredBackend == CUDA, so D3D12 always fails with "D3D12 interop was not configured"
; regardless of hardware - it's an actual bug in this beta plugin, not a config issue.
; Vulkan uses a separate NVIGI plugin variant (chatterbox::vulkan) that never touches the
; CIG/D3D12-interop path at all, so it sidesteps both problems.
PreferredBackend=Vulkan
; Silenced on purpose: the virtual human pipeline plays synthesized speech through
; Audio2Face's own ACEAudioCurveSourceComponent (in sync with lipsync curves) via
; UVirtualHumanConversationComponent. ACE TTS's own playback path stays fully active
; for synthesis and OnAudioSamplesReady streaming - only its audible output is muted,
; so we don't hear the same line twice (once from TTS, once from Audio2Face).
VolumeMultiplier=0.000000

[/Script/EngineSettings.GeneralProjectSettings]
